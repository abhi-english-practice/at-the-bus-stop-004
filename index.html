he city centre.", "chunks": ["Commuters living in the suburbs", "often rely heavily on", "bus routes that connect them", "with the city centre"], "dist": ["are relied heavily in", "which connects they"]}, {"vi": "Vì chuyến xe đầu tiên đã đầy, chúng tôi buộc phải đợi chuyến tiếp theo dù đang vội.", "en": "As the first bus was already full, we had no choice but to wait for the next one even though we were in a hurry.", "chunks": ["As the first bus was already full", "we had no choice but to wait", "for the next one", "even though we were in a hurry"], "dist": ["we had no choice to waiting", "despite we were hurried"]}, {"vi": "Một mạng lưới giao thông công cộng được tích hợp tốt có thể giúp người dân chuyển tuyến mà không phải chờ quá lâu.", "en": "A well-integrated public transport network can enable passengers to change services without having to wait too long.", "chunks": ["A well-integrated public transport network", "can enable passengers", "to change services", "without having to wait too long"], "dist": ["can enable passengers changing", "without have to wait"]}, {"vi": "Người đi bộ dễ gặp nguy hiểm hơn tại những nút giao thiếu đèn tín hiệu và vạch qua đường rõ ràng.", "en": "Pedestrians are more vulnerable at intersections where traffic lights and clearly marked crossings are lacking.", "chunks": ["Pedestrians are more vulnerable", "at intersections where", "traffic lights and clearly marked crossings", "are lacking"], "dist": ["are more vulnerability", "is lacked"]}, {"vi": "Tài xế được khuyến cáo giảm tốc độ khi đến gần khu dân cư, đặc biệt là vào giờ trẻ em tan học.", "en": "Drivers are advised to slow down when approaching residential areas, particularly around the time children leave school.", "chunks": ["Drivers are advised to slow down", "when approaching residential areas", "particularly around the time", "children leave school"], "dist": ["are advised slowing down", "when children will leave school"]}, {"vi": "Nếu thành phố đầu tư vào làn xe đạp an to ty line until the bus has come to a complete stop.", "chunks": ["Passengers are required", "to remain behind the safety line", "until the bus has come", "to a complete stop"], "dist": ["are required remaining", "until the bus will come"]}, {"vi": "Việc tắc nghẽn kéo dài có thể khiến thời gian di chuyển trở nên khó dự đoán, ngay cả trên những tuyến đường quen thuộc.", "en": "Persistent congestion can make journey times unpredictable, even on routes that commuters use every day.", "chunks": ["Persistent congestion can make", "journey times unpredictable", "even on routes that commuters", "use every day"], "dist": ["can make journey times unpredictably", "routes which commuters uses"]}, {"vi": "Thành phố đã điều chỉnh chu kỳ đèn giao thông nhằm giải phóng các nút giao đông đúc nhanh hơn vào giờ cao điểm.", "en": "The city has adjusted traffic-light timings in order to clear busy intersections more efficiently during peak periods.", "chunks": ["The city has adjusted", "traffic-light timings", "in order to clear busy intersections", "more efficiently during peak periods"], "dist": ["for clearing busy intersections", "more efficient during"]}, {"vi": "Mặc dù tuyến tàu điện mới đắt để xây dựng, nó có thể tạo ra lợi ích lâu dài nếu đủ người sử dụng.", "en": "Although the new metro line is expensive to build, it could generate long-term benefits if enough people use it.", "chunks": ["Although the new metro line", "is expensive to build", "it could generate long-term benefits", "if enough people use it"], "dist": ["despite it is expensive", "if enough people will use it"]}, {"vi": "Việc giới hạn chỗ đỗ xe ở trung tâm có thể khiến một số tài xế cân nhắc những phương thức đi lại khác.", "en": "Restricting parking in the city centre may encourage some drivers to consider alternative ways of getting around.", "chunks": ["Restricting parking", "in the city centre", "may encourage some drivers", "to consider alternative ways of getting around"], "dist": ["may encourage drivers considering", "alternative ways to getting around"]}, {"vi": "Những người sử dụng xe buýt thường xuyên có xu hướng đánh giá độ tin cậy dựa trên việc xe có đến đúng giờ hay không.", "en": "Regular bus users tend to judge reliability by whether services arrive when they are scheduled to.", "chunks": ["Regular bus users tend to judge", "reliability by whether", "services arrive", "when they are scheduled to"], "dist": ["tend judging reliability", "when they schedule to"]}, {"vi": "Nếu một tuyến đường bị đóng đột ngột, tài xế có thể bị chuyển hướng qua những con phố vốn không được thiết kế cho lưu lượng lớn.", "en": "If a road is closed unexpectedly, drivers may be diverted through streets that were never designed for heavy traffic.", "chunks": ["If a road is closed unexpectedly", "drivers may be diverted", "through streets that were never designed", "for heavy traffic"], "dist": ["drivers may divert", "streets that never designed"]}, {"vi": "Nhờ có thông tin thời gian thực, hành khách có thể quyết định nên đợi xe buýt hay chuyển sang một tuyến khác.", "en": "With access to real-time information, passengers can decide whether to wait for the bus or switch to another route.", "chunks": ["With access to real-time information", "passengers can decide", "whether to wait for the bus", "or switch to another route"], "dist": ["can decide whether waiting", "or to switching"]}, {"vi": "Một trong những cách hiệu quả nhất để giảm tai nạn là khiến tốc độ thực tế của xe phù hợp hơn với môi trường đường phố.", "en": "One of the most effective ways to reduce collisions is to make vehicle speeds more appropriate for the street environment.", "chunks": ["One of the most effective ways", "to reduce collisions", "is to make vehicle speeds", "more appropriate for the street environment"], "dist": ["One of the most effective way", "is making vehicle speeds"]}, {"vi": "Người đi xe đạp thường tránh những tuyến đường có lưu lượng xe lớn trừ khi có làn đường được bảo vệ.", "en": "Cyclists often avo function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function norm(s){return (s||"").toLowerCase().replace(/[.,;:!?]/g,"").replace(/[’]/g,"'").replace(/\s+/g," ").trim();}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");window.scrollTo({top:0,behavior:"smooth"});});

let q=0,correct=0,attempts=0,bank=[],built=[];
function freshPieces(){const d=DATA[q];return shuffle(d.chunks.map((t,i)=>({id:"c"+i,text:t,extra:false})).concat(d.dist.map((t,i)=>({id:"d"+i,text:t,extra:true}))));}
function render(){const d=DATA[q];document.getElementById("vi").textContent=d.vi;bank=freshPieces();built=[];document.getElementById("feedback").textContent="";document.getElementById("feedback").className="feedback";document.getElementById("answerBox").style.display="none";document.getElementById("caseCount").textContent=`CASE ${String(q+1).padStart(2,"0")} / 60`;renderPieces();updateStats();}
function renderPieces(){const b=document.getElementById("bank"),a=document.getElementById("built");b.innerHTML="";a.innerHTML="";bank.forEach(p=>{const el=document.createElement("button");el.className="chip"+(p.extra?" extra":"");el.textContent=p.text;el.onclick=()=>{bank=bank.filter(x=>x!==p);built.push(p);renderPieces();};b.appendChild(el);});built.forEach(p=>{const el=document.createElement("button");el.className="chip"+(p.extra?" extra":"");el.textContent=p.text;el.onclick=()=>{built=built.filter(x=>x!==p);bank.push(p);renderPieces();};a.appendChild(el);});}
function updateStats(){document.getElementById("score").textContent=`${correct} correct · ${attempts} checks`;document.getElementById("prog").style.width=`${(q+1)/60*100}%`;}
document.getElementById("check").onclick=()=>{const d=DATA[q],user=built.map(x=>x.text).join(" ");attempts++;const fb=document.getElementById("feedback");if(norm(user)===norm(d.en)){correct++;fb.textContent="✓ Correct";fb.className="feedback ok";}else{fb.textContent="✗ Check the order, grammar, and distractor pieces.";fb.className="feedback bad";const box=document.getElementById("answerBox");box.style.display="block";box.innerHTML="<b>Model sentence:</b> "+d.en;}updateStats();};
document.getElementById("clear").onclick=()=>{bank=freshPieces();built=[];renderPieces();document.getElementById("feedback").textContent="";document.getElementById("answerBox").style.display="none";};
function goNext(dir=1){q=(q+dir+DATA.length)%DATA.length;render();document.getElementById("order").scrollIntoView({behavior:"smooth",block:"start"});}
document.getElementById("next").onclick=()=>goNext(1);document.getElementById("skip").onclick=()=>goNext(1);document.getElementById("back").onclick=()=>goNext(-1);render();

let set=[],L=[],R=[],selL=null,selR=null,done=new Set();
function newMatch(){const n=Number(document.getElementById("matchSize").value);set=shuffle(MATCH).slice(0,n).map((x,i)=>({...x,key:i}));L=shuffle(set);R=shuffle(set);selL=selR=null;done=new Set();drawMatch();}
function drawMatch(){const l=document.getElementById("left"),r=document.getElementById("right");l.innerHTML="";r.innerHTML="";L.forEach((x,i)=>{const el=document.createElement("div");el.className="matchitem"+(done.has(x.key)?" done":"")+(selL===x.key?" selected":"");el.innerHTML=`<span>${x.en}</span><span class="idx">${String(i+1).padStart(2,"0")}</span>`;if(!done.has(x.key))el.onclick=()=>{selL=x.key;drawMatch();testMatch();};l.appendChild(el);});R.forEach((x,i)=>{const el=document.createElement("div");el.className="matchitem"+(done.has(x.key)?" done":"")+(selR===x.key?" selected":"");el.innerHTML=`<span>${x.vi}</span><span class="idx">${String(i+1).padStart(2,"0")}</span>`;if(!done.has(x.key))el.onclick=()=>{selR=x.key;drawMatch();testMatch();};r.appendChild(el);});document.getElementById("matchScore").textContent=`${done.size} / ${set.length} matched`;document.getElementById("complete").style.display=done.size===set.length?"block":"none";}
function testMatch(){if(selL===null||selR===null)return;if(selL===selR){done.add(selL);const item=set.find(x=>x.key===selL);selL=selR=null;setTimeout(drawMatch,70);}else{const a=selL,b=selR;selL=selR=null;drawMatch();const li=[...document.querySelectorAll("#left .matchitem")].find((el,i)=>L[i].key===a);const ri=[...document.querySelectorAll("#right .matchitem")].find((el,i)=>R[i].key===b);[li,ri].forEach(el=>{if(el){el.classList.add("wrong");setTimeout(()=>el.classList.remove("wrong"),300);}});}}
document.getElementById("newMatch").onclick=newMatch;document.getElementById("matchSize").onchange=newMatch;newMatch();
</script>
</body>
